namespace: mysql

serviceAccountName: mysql-sa

image:
  repository: mysql
  tag: "8.0"

replicaCount: 1

secrets:
  - name: MYSQL_ROOT_PASSWORD
    value: rootpassword

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 200m
    memory: 512Mi

pvc:
  storageRequest: 2Gi

affinity:
  key: "app"
  values:
    - mysql

tolerations:
  - key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"

service:
  type: ClusterIP
  port: 3306

serviceAccount:
  create: true
  annotations: {}
  automount: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
