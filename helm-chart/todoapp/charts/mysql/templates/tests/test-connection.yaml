apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mysql.fullname" . }}-test-connection"
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: mysql-client
      image: mysql:8
      command: [ "sh", "-c" ]
      args: [ "mysql -h {{ .Values.mysql.host }} -u {{ .Values.mysql.user }} -p{{ .Values.mysql.password }} -e 'SELECT 1'" ]

  restartPolicy: Never
